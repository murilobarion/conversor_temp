<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor Temperatura</title>
</head>
<body>
    <div id="box">
        <h3>Valor:</h3>
        <input type="text" placeholder="Temperatura: 30°" id="valor">

        <div class="option-group">
            <div class="option-item">
                <input type="radio" id="celsiusParaFahrenheit" name="conversao">
                <label for="celsiusParaFahrenheit">Celsius para Fahrenheit</label>
                <br>
            </div>

            <div class="option-item">
                <input type="radio" id="fahrenheitParaCelsius" name="conversao">
                <label for="fahrenheitParaCelsius">Fahrenheit para Celsius</label>
                <br>
            </div>
        </div>

        <h3 id="resultado">Resultado:</h3>

        <button type="button" onclick="convertCelsiusToFahrenheit()" id="converter">Converter</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
